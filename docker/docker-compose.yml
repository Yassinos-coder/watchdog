name: watchdog

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: watchdog
      POSTGRES_PASSWORD: watchdog
      POSTGRES_DB: watchdog
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U watchdog']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  watchdog:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    profiles: ['app']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://watchdog:watchdog@postgres:5432/watchdog
      REDIS_URL: redis://redis:6379
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      WATCHDOG_SECRET_KEY: ${WATCHDOG_SECRET_KEY:-}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  redis-data:
